<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} </title>
    <meta name="description" content="{{ .Description | default .Site.Data.site.description }}">
    
    <link rel="icon" type="image/x-icon" href="/assets/default.png">

    <!-- This layout has no header/content to settle, so just clear any
         stale flags (e.g. about -> resume) rather than let them leak into a
         later, unrelated page load -- see expander.js / baseof.html. -->
    <script>
    if (sessionStorage.getItem('siteSettle')) sessionStorage.removeItem('siteSettle');
    if (sessionStorage.getItem('sitePageFade')) sessionStorage.removeItem('sitePageFade');
    </script>

    <link rel="stylesheet" href="/css/global.css">
    <!-- The 2col / 3col column blocks are styled in this file. -->
    <link rel="stylesheet" href="/css/content.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

    <main class="main-content default-expanded">
        <div id="navSentinel"></div>
        <div class="navigation">
            {{ range .Site.Data.site.nav.main }}
            <a href="{{ .url | relURL }}" class="{{ if eq $.RelPermalink .url }}active{{ end }}" data-expand="true">{{ .label }}</a>
            {{ end }}

            <div style="position: absolute; right: 10px; display:flex; gap: 30px">
                {{ range .Site.Data.site.nav.right }}
                <a href="{{ .url | relURL }}" class="{{ if eq $.RelPermalink .url }}active{{ end }}" data-expand="true">{{ .label }}</a>
                {{ end }}
            </div>
        </div>

        <div class="container">
            {{ .Content }}
        </div>
    </main>

    <script src="/scripts/expander.js?v={{ (os.Stat "static/scripts/expander.js").ModTime.Unix }}"></script>
    <script src="/scripts/nav-sticky.js?v={{ (os.Stat "static/scripts/nav-sticky.js").ModTime.Unix }}"></script>
    </body>

</html>

{{ $footer := .Site.Data.site.footer }}
<footer>
    <div class="footer-head"{{ with .Params.bgColor }} style="color: {{ . }};"{{ end }}>{{ $footer.heading }}</div>

    <div class="footer-content">
        {{ range $footer.columns }}
        <div class="footer-column">
            <h4>{{ .title }}</h4>
            <ul>
                {{ range .links }}
                <li><a href="{{ .url }}">{{ .label }}</a></li>
                {{ end }}
            </ul>
        </div>

        {{ end }}
    </div>

    <div class="footer-bottom">
        <span>&copy; {{ now.Year }} {{ $footer.copyright }}</span>
        <a href="{{ $footer.bottomUrl }}">{{ $footer.bottomLabel }}</a>
    </div>
    <p class="light-text">
        Last updated on {{ now.Format "January 02, 2006" }}
    </p>
</footer>
